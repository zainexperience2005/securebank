services:
  postgres:
    image: postgres:17
    container_name: securebank_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: securebank
      POSTGRES_PASSWORD: securebank123
      POSTGRES_DB: securebank
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U securebank -d securebank"
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres_test:
    image: postgres:17
    container_name: securebank_postgres_test
    restart: unless-stopped
    environment:
      POSTGRES_USER: securebank
      POSTGRES_PASSWORD: securebank123
      POSTGRES_DB: securebank_test
    ports:
      - "5433:5432"

  redis:
    image: redis:7-alpine
    container_name: securebank_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: securebank_api

    restart: unless-stopped

    ports:
      - "8000:8000"

    environment:
      DATABASE_URL: postgresql+psycopg://securebank:securebank123@postgres:5432/securebank
      REDIS_URL: redis://redis:6379

      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: ${JWT_ALGORITHM}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES}

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy


volumes:
  postgres_data:
  redis_data: