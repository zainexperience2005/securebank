# Render Infrastructure as Code (Blueprint) configuration
# Documentation: https://render.com/docs/blueprint-spec

services:
  # 1. FastAPI Application Web Service
  - type: web
    name: securebank-api
    runtime: docker
    plan: free
    dockerfilePath: Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: securebank-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: securebank-redis
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"

  # 2. Redis Key-Value Store & Rate Limiter
  - type: redis
    name: securebank-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList:
      - source: 0.0.0.0/0
        description: Allow internal and external access

databases:
  # 3. PostgreSQL Database
  - name: securebank-db
    databaseName: securebank
    user: securebank
    plan: free
