[project]
name = "securebank"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "zainexperience2005", email = "zainexperience0@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.19.1",
    "email-validator>=2.3.0",
    "fastapi[all]>=0.141.1",
    "passlib[bcrypt]>=1.7.4",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.13.0",
    "redis>=8.1.0",
    "sqlalchemy>=2.0.52",
]

[project.scripts]
securebank = "securebank:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-mock>=3.15.1",
]
